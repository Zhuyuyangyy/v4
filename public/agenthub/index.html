<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Orchestration Hub</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: transparent;
      font-family: "Outfit", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .agenthub-scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(168, 226, 255, 0.18);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 42%, rgba(0, 188, 255, 0.22), transparent 30%),
        radial-gradient(circle at 18% 78%, rgba(58, 98, 255, 0.16), transparent 28%),
        radial-gradient(circle at 83% 70%, rgba(255, 190, 84, 0.12), transparent 24%),
        linear-gradient(155deg, #06142a 0%, #071a32 38%, #081426 70%, #030815 100%);
      touch-action: none;
    }
    .agenthub-scene canvas {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
    }
    .agenthub-vignette,
    .agenthub-grid,
    .agenthub-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .agenthub-vignette {
      z-index: 3;
      background:
        radial-gradient(ellipse at 50% 44%, transparent 54%, rgba(3, 14, 28, 0.2) 78%, rgba(1, 5, 13, 0.56) 100%),
        linear-gradient(90deg, rgba(1, 8, 18, 0.28), transparent 24%, transparent 76%, rgba(1, 8, 18, 0.28));
    }
    .agenthub-grid {
      z-index: 1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(154, 230, 255, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(154, 230, 255, 0.14) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: perspective(720px) rotateX(64deg) translateY(20%);
      transform-origin: 50% 80%;
      mask-image: linear-gradient(180deg, transparent, black 34%, transparent 88%);
    }
    .agenthub-scan {
      z-index: 1;
      opacity: 0.28;
      mix-blend-mode: screen;
      background: linear-gradient(180deg, transparent 0%, rgba(164, 236, 255, 0.12) 50%, transparent 58%);
      animation: scan 5.6s linear infinite;
    }
    .agenthub-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgba(15, 36, 56, 0.72);
      transition: opacity 0.35s ease;
    }
    .agenthub-loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .agenthub-spinner {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(172, 232, 255, 0.24);
      border-top-color: rgba(214, 250, 255, 0.96);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan {
      0% { transform: translateY(-62%); }
      100% { transform: translateY(62%); }
    }
  </style>
</head>
<body>
  <div id="root">
    <section id="hubwrap" class="agenthub-scene" aria-label="Multi-agent collaboration scene">
      <div class="agenthub-grid" aria-hidden="true"></div>
      <div class="agenthub-scan" aria-hidden="true"></div>
      <div class="agenthub-vignette" aria-hidden="true"></div>
      <div id="loadtip" class="agenthub-loading" aria-hidden="true">
        <div class="agenthub-spinner"></div>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { RoomEnvironment } from 'https://esm.sh/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';
    import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    const MODEL_URLS = ['/agenthub/models/agent_hub_concept_refined_final.glb'];
    const STATIONS = [
      { id: 'profile', color: '#9B8CFF', pos: new THREE.Vector3(0, 1.05, -9.5) },
      { id: 'path', color: '#35E0D8', pos: new THREE.Vector3(8.227, 1.05, -4.75) },
      { id: 'resource', color: '#1ABF90', pos: new THREE.Vector3(8.227, 1.05, 4.75) },
      { id: 'tutor', color: '#F0B24A', pos: new THREE.Vector3(0, 1.05, 9.5) },
      { id: 'eval', color: '#F0586E', pos: new THREE.Vector3(-8.227, 1.05, 4.75) },
      { id: 'loop', color: '#7C8CFF', pos: new THREE.Vector3(-8.227, 1.05, -4.75) },
    ];

    const wrap = document.getElementById('hubwrap');
    const loading = document.getElementById('loadtip');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06142a);
    scene.fog = new THREE.FogExp2(0x06142a, 0.0065);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(32, wrap.clientWidth / wrap.clientHeight, 0.1, 500);
    camera.position.set(14.2, 9.2, 17.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 11.5;
    controls.maxDistance = 32;
    controls.maxPolarAngle = Math.PI / 2.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    let rotateTimer = 0;
    controls.addEventListener('start', () => {
      controls.autoRotate = false;
      clearTimeout(rotateTimer);
    });
    controls.addEventListener('end', () => {
      clearTimeout(rotateTimer);
      rotateTimer = setTimeout(() => { controls.autoRotate = true; }, 2800);
    });

    scene.add(new THREE.HemisphereLight(0x9eeaff, 0x102032, 0.84));

    const key = new THREE.DirectionalLight(0xf6fbff, 2.9);
    key.position.set(-9, 18, 13);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 80;
    key.shadow.camera.left = -24;
    key.shadow.camera.right = 24;
    key.shadow.camera.top = 24;
    key.shadow.camera.bottom = -24;
    key.shadow.bias = -0.00035;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xb9cfff, 1.25);
    fill.position.set(12, 7, -10);
    scene.add(fill);

    const coreLight = new THREE.PointLight(0x79e7ff, 3.8, 60, 1.6);
    coreLight.position.set(0, 3.6, 0);
    scene.add(coreLight);

    const stationLights = STATIONS.map((station) => {
      const light = new THREE.PointLight(station.color, 0.35, 14, 2.2);
      light.position.copy(station.pos).add(new THREE.Vector3(0, 1.0, 0));
      scene.add(light);
      return light;
    });

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(wrap.clientWidth, wrap.clientHeight), 0.34, 0.5, 0.92);
    composer.addPass(bloom);

    const refs = {
      root: null,
      mixer: null,
      rings: [],
      packets: [],
      stationMeshes: new Map(),
      emissiveMaterials: new Map(),
      activeObjects: [],
      flowPackets: [],
      flowArcs: [],
      pulseRings: [],
      scanRings: [],
      gltfAnimations: 0,
      loadedModelUrl: null,
    };
    let activeIndex = 0;
    let activeId = STATIONS[0].id;

    function radialTexture(size, stops) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      stops.forEach(([at, color]) => grad.addColorStop(at, color));
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function makeEnvironment() {
      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(34, 192).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({
          color: 0x06182f,
          metalness: 0.46,
          roughness: 0.38,
          transparent: true,
          opacity: 0.04,
          envMapIntensity: 0.9,
          depthWrite: false,
        })
      );
      floor.position.y = -0.12;
      floor.receiveShadow = true;
      scene.add(floor);

      const contact = new THREE.Mesh(
        new THREE.CircleGeometry(25, 160).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({
          map: radialTexture(512, [
            [0, 'rgba(0,0,0,0.58)'],
            [0.42, 'rgba(0,0,0,0.3)'],
            [0.82, 'rgba(0,0,0,0.06)'],
            [1, 'rgba(0,0,0,0)'],
          ]),
          transparent: true,
          opacity: 0.45,
          depthWrite: false,
        })
      );
      contact.position.y = -0.08;
      scene.add(contact);

      const glow = new THREE.Mesh(
        new THREE.CircleGeometry(46, 192).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({
          map: radialTexture(512, [
            [0, 'rgba(138,232,255,0.2)'],
            [0.38, 'rgba(70,154,255,0.09)'],
            [1, 'rgba(0,0,0,0)'],
          ]),
          transparent: true,
          opacity: 0.16,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        })
      );
      glow.position.y = -0.1;
      scene.add(glow);

      const starGeo = new THREE.BufferGeometry();
      const count = 320;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const radius = 38 + Math.random() * 72;
        const angle = Math.random() * Math.PI * 2;
        pos[i * 3] = Math.cos(angle) * radius;
        pos[i * 3 + 1] = Math.random() * 30 - 2;
        pos[i * 3 + 2] = Math.sin(angle) * radius;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
        color: 0xbdefff,
        size: 0.18,
        transparent: true,
        opacity: 0.24,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      })));
    }

    function curveBetween(a, b, lift = 2.4) {
      const mid = a.clone().lerp(b, 0.5);
      mid.y += lift;
      mid.multiplyScalar(1.03);
      return new THREE.QuadraticBezierCurve3(a.clone(), mid, b.clone());
    }

    function createFlowLayer() {
      const core = new THREE.Vector3(0, 2.6, 0);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xb8f6ff,
        transparent: true,
        opacity: 0.56,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      for (let i = 0; i < STATIONS.length; i++) {
        const station = STATIONS[i];
        const next = STATIONS[(i + 1) % STATIONS.length];
        const ringCurve = curveBetween(station.pos, next.pos, 1.15);
        const coreCurve = curveBetween(station.pos.clone().add(new THREE.Vector3(0, 0.4, 0)), core, 2.5);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: station.color,
          transparent: true,
          opacity: 0.2,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const arc = new THREE.Mesh(new THREE.TubeGeometry(ringCurve, 48, 0.026, 8, false), tubeMat);
        scene.add(arc);
        refs.flowArcs.push({ mesh: arc, material: tubeMat, stationIndex: i, kind: 'handoff' });

        const spokeMat = new THREE.MeshBasicMaterial({
          color: station.color,
          transparent: true,
          opacity: 0.08,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const spoke = new THREE.Mesh(new THREE.TubeGeometry(coreCurve, 42, 0.018, 8, false), spokeMat);
        scene.add(spoke);
        refs.flowArcs.push({ mesh: spoke, material: spokeMat, stationIndex: i, kind: 'core' });

        for (let j = 0; j < 3; j++) {
          const material = new THREE.MeshBasicMaterial({
            color: station.color,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          const packet = new THREE.Mesh(new THREE.SphereGeometry(0.095 + j * 0.018, 18, 18), material);
          const halo = new THREE.Mesh(new THREE.SphereGeometry(0.24 + j * 0.05, 18, 18), new THREE.MeshBasicMaterial({
            color: station.color,
            transparent: true,
            opacity: 0.14,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }));
          const group = new THREE.Group();
          group.add(packet, halo);
          scene.add(group);
          refs.flowPackets.push({
            group,
            packet,
            halo,
            material,
            haloMaterial: halo.material,
            curve: j === 2 ? coreCurve : ringCurve,
            stationIndex: i,
            offset: (j / 3) * 0.72,
            speed: j === 2 ? 0.18 : 0.28,
            corePacket: j === 2,
          });
        }
      }

      for (let i = 0; i < 4; i++) {
        const torus = new THREE.Mesh(
          new THREE.TorusGeometry(1.6 + i * 0.52, 0.012, 8, 128),
          coreMat.clone()
        );
        torus.rotation.x = Math.PI / 2;
        torus.position.y = 2.55 + i * 0.34;
        torus.material.opacity = 0.35 - i * 0.055;
        scene.add(torus);
        refs.pulseRings.push(torus);
      }

      for (const station of STATIONS) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.92, 0.018, 8, 96),
          new THREE.MeshBasicMaterial({
            color: station.color,
            transparent: true,
            opacity: 0.36,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.copy(station.pos).add(new THREE.Vector3(0, 0.18, 0));
        scene.add(ring);
        refs.scanRings.push(ring);
      }
    }

    function stationIndexFromName(name) {
      const match = name.match(/(?:station|agent)_(0[1-6])_/i) || name.match(/refined_station_(0[1-6])_/i);
      return match ? Number(match[1]) - 1 : -1;
    }

    function applyMaterialTuning(object, name) {
      const materials = Array.isArray(object.material) ? object.material : [object.material];
      materials.forEach((material) => {
        if (!material) return;
        if ('envMapIntensity' in material) material.envMapIntensity = /holo|glass|wall/i.test(name) ? 2.25 : 1.18;
        if ('roughness' in material && !/holo|beam|arc|ring|orbit|scan|packet/i.test(name)) {
          material.roughness = Math.min(Math.max(material.roughness ?? 0.42, 0.24), 0.58);
        }
        if ('metalness' in material && /core|station|pedestal|deck|disc|graphite|metal/i.test(name)) {
          material.metalness = Math.max(material.metalness ?? 0.2, 0.55);
        }
        if ('opacity' in material && /holo|glass|beam|arc|scan/i.test(name)) {
          material.transparent = true;
          material.opacity = Math.min(material.opacity ?? 1, /beam/i.test(name) ? 0.42 : 0.58);
        }
        if ('emissiveIntensity' in material && /beam|arc|ring|orbit|scan|packet|beacon|neon/i.test(name)) {
          material.emissiveIntensity = Math.min(Math.max(material.emissiveIntensity ?? 1, 1.35), 2.8);
        }
        material.needsUpdate = true;
      });
    }

    function indexModel(root) {
      root.traverse((object) => {
        const name = object.name || '';
        if (!object.isMesh) return;
        if (/label|title|board|concept|keyword|kicker|input|output|detail|handoff_note|backdrop|dark_cinematic|env_reflective/i.test(name)) {
          object.visible = false;
          return;
        }
        if (/floor_radial|background_light_slab/i.test(name)) {
          object.visible = false;
          return;
        }
        object.frustumCulled = false;
        object.castShadow = !/holo|glass|wall|beam|arc|ring|orbit|scan|packet/i.test(name);
        object.receiveShadow = /core|station|pedestal|deck|disc/i.test(name);
        applyMaterialTuning(object, name);

        if (/ring|orbit|arc|scan/i.test(name)) refs.rings.push(object);
        if (/data_packet|refined_orbit_data_cube/i.test(name)) refs.packets.push({
          object,
          base: object.position.clone(),
          radius: Math.max(0.5, Math.hypot(object.position.x, object.position.z)),
          angle: Math.atan2(object.position.z, object.position.x),
        });
        const stationIndex = stationIndexFromName(name);
        if (stationIndex >= 0) {
          if (!refs.stationMeshes.has(stationIndex)) refs.stationMeshes.set(stationIndex, []);
          refs.stationMeshes.get(stationIndex).push(object);
        }
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        materials.forEach((material) => {
          if (!material || !('emissiveIntensity' in material)) return;
          refs.emissiveMaterials.set(material.uuid, { material, base: material.emissiveIntensity || 0 });
        });
      });
    }

    function frameModel(root) {
      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      root.position.sub(center);
      root.position.y += 0.68;
      root.scale.setScalar(1.28);
      const maxDim = Math.max(size.x, size.z) * 1.28;
      camera.position.set(maxDim * 0.5, maxDim * 0.34, maxDim * 0.66);
      controls.target.set(0, 2.55, 0);
      controls.minDistance = maxDim * 0.34;
      controls.maxDistance = maxDim * 1.08;
      camera.near = 0.1;
      camera.far = maxDim * 12;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function setBeat(id, notifyParent = false) {
      const index = STATIONS.findIndex((station) => station.id === id);
      activeIndex = index >= 0 ? index : 0;
      activeId = STATIONS[activeIndex].id;
      if (notifyParent) {
        window.parent?.postMessage({ type: 'agenthub:beat', id: activeId, beat: activeIndex }, '*');
      }
    }

    function cycleBeats() {
      clearInterval(window.__agentHubCycle);
      window.__agentHubCycle = setInterval(() => {
        setBeat(STATIONS[(activeIndex + 1) % STATIONS.length].id, true);
      }, 2600);
      window.__agentHubJumpToBeat = (id) => setBeat(id, true);
    }

    window.addEventListener('message', (event) => {
      if (event.data?.type !== 'agenthub:setBeat') return;
      window.__agentHubJumpToBeat?.(event.data.id);
    });

    function loadModel(urls, index = 0) {
      const url = urls[index];
      new GLTFLoader().load(
        url,
        (gltf) => {
          refs.root = gltf.scene;
          refs.gltfAnimations = gltf.animations?.length || 0;
          refs.loadedModelUrl = url;
          scene.add(refs.root);
          indexModel(refs.root);
          frameModel(refs.root);
          if (refs.gltfAnimations) {
            refs.mixer = new THREE.AnimationMixer(refs.root);
            gltf.animations.forEach((clip) => refs.mixer.clipAction(clip).play());
          }
          loading.classList.add('hide');
          cycleBeats();
        },
        undefined,
        () => {
          if (index + 1 < urls.length) loadModel(urls, index + 1);
          else loading.classList.add('hide');
        }
      );
    }

    makeEnvironment();
    createFlowLayer();
    setBeat('profile', true);
    loadModel(MODEL_URLS);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    wrap.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(refs.root ? [refs.root] : [], true);
      if (!hits.length) return;
      let closest = 0;
      let best = Infinity;
      STATIONS.forEach((station, index) => {
        const dist = hits[0].point.distanceTo(station.pos);
        if (dist < best) {
          best = dist;
          closest = index;
        }
      });
      setBeat(STATIONS[closest].id, true);
    });

    const clock = new THREE.Clock();
    function animate() {
      const delta = clock.getDelta();
      const elapsed = clock.elapsedTime;
      refs.mixer?.update(delta);
      controls.update();

      const activeStation = STATIONS[activeIndex];
      coreLight.color.set(activeStation.color);
      coreLight.intensity = 3.8 + Math.sin(elapsed * 3.2) * 0.55;

      stationLights.forEach((light, index) => {
        const active = index === activeIndex;
        light.intensity = active ? 2.6 + Math.sin(elapsed * 4.8) * 0.55 : 0.32;
      });

      refs.rings.forEach((ring, index) => {
        ring.rotation.z += (index % 2 ? -1 : 1) * (0.003 + (index % 5) * 0.00035);
      });

      refs.packets.forEach((packet, index) => {
        const speed = 0.18 + (index % 7) * 0.012;
        const angle = packet.angle + elapsed * speed;
        packet.object.position.x = Math.cos(angle) * packet.radius;
        packet.object.position.z = Math.sin(angle) * packet.radius;
        packet.object.position.y = packet.base.y + Math.sin(elapsed * 2.4 + index) * 0.08;
        packet.object.rotation.y += 0.018;
      });

      refs.flowPackets.forEach((packet) => {
        const active = packet.stationIndex === activeIndex;
        const t = (elapsed * packet.speed + packet.offset + packet.stationIndex * 0.04) % 1;
        packet.group.position.copy(packet.curve.getPointAt(t));
        const scale = active ? 1.35 + Math.sin(elapsed * 7.2) * 0.15 : 0.82;
        packet.group.scale.setScalar(scale);
        packet.material.opacity = active ? 1 : 0.52;
        packet.haloMaterial.opacity = active ? 0.22 : 0.08;
      });

      refs.flowArcs.forEach((arc) => {
        const active = arc.stationIndex === activeIndex;
        const pulse = (Math.sin(elapsed * 4.2 + arc.stationIndex) + 1) * 0.5;
        arc.material.opacity = active
          ? (arc.kind === 'core' ? 0.36 : 0.54) + pulse * 0.12
          : (arc.kind === 'core' ? 0.06 : 0.13);
      });

      refs.pulseRings.forEach((ring, index) => {
        const wave = (elapsed * 0.9 + index * 0.28) % 1;
        const scale = 0.88 + wave * 1.5;
        ring.scale.setScalar(scale);
        ring.material.opacity = Math.max(0, 0.42 * (1 - wave));
        ring.rotation.z += 0.006 * (index % 2 ? -1 : 1);
      });

      refs.scanRings.forEach((ring, index) => {
        const active = index === activeIndex;
        const wave = (elapsed * 1.2 + index * 0.13) % 1;
        ring.scale.setScalar(active ? 1.0 + wave * 0.75 : 0.82);
        ring.material.opacity = active ? 0.56 * (1 - wave * 0.55) : 0.12;
        ring.rotation.z += active ? 0.014 : 0.004;
      });

      refs.stationMeshes.forEach((objects, index) => {
        const active = index === activeIndex;
        const boost = active ? 1.0 + Math.sin(elapsed * 5.4) * 0.08 : 1;
        objects.forEach((object) => {
          object.scale.lerp(new THREE.Vector3(boost, boost, boost), 0.08);
        });
      });

      refs.emissiveMaterials.forEach(({ material, base }) => {
        material.emissiveIntensity = Math.min(3.4, base + 0.12 + Math.sin(elapsed * 2.8) * 0.08);
      });

      bloom.strength = 0.32 + Math.sin(elapsed * 1.15) * 0.03;
      composer.render();
      window.__agentHubState = {
        ready: !!refs.root,
        activeId,
        activeIndex,
        model: refs.root ? MODEL_URLS.find((url) => url) : null,
        loadedModelUrl: refs.loadedModelUrl,
        gltfAnimations: refs.gltfAnimations,
        flowPackets: refs.flowPackets.length,
      };
      window.__hubRAF = requestAnimationFrame(animate);
    }
    animate();

    function resize() {
      const width = wrap.clientWidth || 1;
      const height = wrap.clientHeight || 1;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
      composer.setSize(width, height);
    }
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
