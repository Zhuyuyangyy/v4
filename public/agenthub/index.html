<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能体枢纽 · 多智能体协同</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; min-height: 100vh; }
    body { font-family: 'Outfit', 'PingFang SC', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #070b18; }
    ::-webkit-scrollbar-thumb { background: rgba(120,160,220,0.2); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(120,160,220,0.35); }

    @keyframes tf-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    @keyframes tf-spin { to { transform: rotate(360deg); } }
    @keyframes tf-twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes tf-railflow { to { background-position: 22px 0; } }
    @keyframes tf-standby { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes tf-baton { 0% { transform: translateX(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(26px); opacity: 0; } }
    @keyframes wb-rise { 0% { opacity: 0; transform: translate(-50%,-36%); } 100% { opacity: 1; transform: translate(-50%,-50%); } }
  </style>
</head>
<body>
  <div id="root">
    <section class="agenthub-embed">
      <div id="hubwrap" class="agenthub-scene">
        <div id="hud" class="agenthub-hud">
          <div class="agenthub-hud-state">LEVEL 03 - RESOURCE 处理中</div>
        </div>
        <div id="loadtip" class="agenthub-loading">
          <div class="agenthub-spinner"></div>
          正在加载三维枢纽
        </div>
        <div class="agenthub-help">拖动旋转 - 滚轮缩放</div>
      </div>
    </section>
  </div>

  <style>
    html, body, #root { width: 100%; height: 100%; min-height: 0; overflow: hidden; }
    body { margin: 0; background: transparent; }
    .agenthub-embed {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 0;
      background: transparent;
    }
    .agenthub-scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(120,160,220,0.16);
      border-radius: 18px;
      background: rgba(5, 6, 16, 0.18);
      touch-action: none;
    }
    .agenthub-scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .agenthub-hud {
      position: absolute;
      bottom: 18px;
      left: 18px;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }
    .agenthub-hud-state {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 7px 12px;
      border: 1px solid rgba(6, 214, 160, 0.28);
      border-radius: 999px;
      background: rgba(4, 8, 18, 0.58);
      font-size: 14px;
      letter-spacing: 0.1em;
      color: #06d6a0;
      font-family: 'JetBrains Mono', monospace;
      backdrop-filter: blur(10px);
    }
    .agenthub-loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #9fb6dc;
      font-size: 13px;
      background: rgba(5,6,16,0.35);
    }
    .agenthub-spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(0,212,255,0.2);
      border-top-color: #00d4ff;
      animation: tf-spin 0.8s linear infinite;
    }
    .agenthub-help {
      position: absolute;
      right: 18px;
      bottom: 16px;
      z-index: 2;
      pointer-events: none;
      color: #8aa0c4;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <!-- 3D hub — INLINED module (no separate cacheable file; exactly one evaluation, one HUB closure) -->
  <script type="module">
  // ===== 智能体枢纽 3D · build HUB_BUILD = 20 =====
  {
    if (window.__hubRAF) { cancelAnimationFrame(window.__hubRAF); window.__hubRAF = null; }
    const HUB_BUILD = 20;
    const BEAT_LABELS = {
      depart: 'LEVEL 00 - 系统待命',
      profile: 'LEVEL 01 - PROFILE 画像识别',
      path: 'LEVEL 02 - PATH 路径规划',
      resource: 'LEVEL 03 - RESOURCE 资源匹配',
      tutor: 'LEVEL 04 - TUTOR 辅导讲解',
      eval: 'LEVEL 05 - EVAL 掌握评估',
      loop: 'A1 - WRITE-BACK 反馈回写',
    };

    const HUB = {
      state: { beat: 0, id: 'depart', ready: false },
      _readyCbs: [],
      setBeat(i, id) {
        this.state.beat = i;
        this.state.id = id;
        const stateEl = document.querySelector('.agenthub-hud-state');
        if (stateEl) stateEl.textContent = BEAT_LABELS[id] || BEAT_LABELS.depart;
        window.parent?.postMessage({ type: 'agenthub:beat', beat: i, id }, '*');
        if (this._apply) this._apply();
      },
      onReady(cb) { if (this.state.ready) cb(); else this._readyCbs.push(cb); },
    };
    window.AgentHub = HUB;

    function startAgentHubCycle() {
      const beats = [
        [0, 'profile'],
        [1, 'path'],
        [2, 'resource'],
        [3, 'tutor'],
        [4, 'eval'],
        [5, 'loop'],
      ];
      let index = 0;
      const scheduleCycle = () => {
        clearInterval(window.__agentHubCycle);
        window.__agentHubCycle = setInterval(() => {
          index = (index + 1) % beats.length;
          HUB.setBeat(...beats[index]);
        }, 5200);
      };
      const jumpToBeat = (id) => {
        const next = beats.findIndex(([, beatId]) => beatId === id);
        if (next < 0) return;
        index = next;
        HUB.setBeat(...beats[index]);
        scheduleCycle();
      };
      window.__agentHubJumpToBeat = jumpToBeat;
      HUB.setBeat(...beats[index]);
      scheduleCycle();
    }

    window.addEventListener('message', (event) => {
      if (event.data?.type !== 'agenthub:setBeat') return;
      window.__agentHubJumpToBeat?.(event.data.id);
    });

    (async function () {
      function waitFor(id) {
        return new Promise((resolve) => {
          const tryGet = () => {
            const el = document.getElementById(id);
            if (el && el.clientWidth > 0) return resolve(el);
            setTimeout(tryGet, 60);
          };
          tryGet();
        });
      }
      const wrap = await waitFor('hubwrap');
      if (!wrap) return;
      wrap.querySelectorAll('canvas').forEach(c => c.remove()); // 清除上一次加载的画布(防僵尸)
      try {
        const THREE = await import('/node_modules/three/build/three.module.js');
        let composer = null, RenderPass, UnrealBloomPass, EffectComposer;
        try {
          ({ EffectComposer } = await import('/node_modules/three/examples/jsm/postprocessing/EffectComposer.js'));
          ({ RenderPass } = await import('/node_modules/three/examples/jsm/postprocessing/RenderPass.js'));
          ({ UnrealBloomPass } = await import('/node_modules/three/examples/jsm/postprocessing/UnrealBloomPass.js'));
        } catch (e) { composer = 'fail'; }

        const W = () => wrap.clientWidth, H = () => wrap.clientHeight || 520;
        const scene = new THREE.Scene();
        // 渐变天幕背景
        const bgC = document.createElement('canvas'); bgC.width = 16; bgC.height = 256;
        const bgx = bgC.getContext('2d');
        const bgg = bgx.createLinearGradient(0, 0, 0, 256);
        bgg.addColorStop(0, '#071832'); bgg.addColorStop(0.34, '#030712'); bgg.addColorStop(0.68, '#06101b'); bgg.addColorStop(1, '#020407');
        bgx.fillStyle = bgg; bgx.fillRect(0, 0, 16, 256);
        scene.background = new THREE.CanvasTexture(bgC);
        scene.fog = new THREE.Fog(0x071827, 82, 168);
        const camera = new THREE.PerspectiveCamera(40, W() / H(), 0.1, 220);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
        renderer.setSize(W(), H());
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.16;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        wrap.appendChild(renderer.domElement);
        const tip = document.getElementById('loadtip'); if (tip) tip.remove();
        const writebackDone = document.createElement('div');
        writebackDone.id = 'writebackDone';
        writebackDone.textContent = '\u56de\u5199\u5b8c\u6210';
        writebackDone.style.cssText = [
          'position:absolute',
          'left:50%',
          'top:18%',
          'transform:translate(-50%,12px)',
          'z-index:3',
          'pointer-events:none',
          'padding:10px 18px',
          'border:1px solid rgba(255,215,138,0.45)',
          'border-radius:999px',
          'background:rgba(5,8,16,0.62)',
          'box-shadow:0 0 30px rgba(255,215,138,0.22)',
          'color:#ffe7b2',
          'font-family:\"Noto Sans SC\",sans-serif',
          'font-size:18px',
          'letter-spacing:0.18em',
          'opacity:0',
          'transition:opacity 520ms cubic-bezier(0.32,0.72,0,1), transform 520ms cubic-bezier(0.32,0.72,0,1)'
        ].join(';');
        wrap.appendChild(writebackDone);

        scene.add(new THREE.HemisphereLight(0x78a9d6, 0x071524, 0.98));
        // 远景星点
        { const sg = new THREE.BufferGeometry(); const sn = 240; const sp = new Float32Array(sn * 3);
          for (let i = 0; i < sn; i++) { const r = 62 + Math.random() * 38, th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI;
            sp[i*3] = r*Math.sin(ph)*Math.cos(th); sp[i*3+1] = Math.abs(r*Math.cos(ph))*0.55 + 5; sp[i*3+2] = r*Math.sin(ph)*Math.sin(th); }
          sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
          scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xc4e5ff, size: 0.46, transparent: true, opacity: 0.74, blending: THREE.AdditiveBlending, depthWrite: false }))); }
        const key = new THREE.DirectionalLight(0xe5f3ff, 1.64); key.position.set(16, 32, 14);
        key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.near = 2; key.shadow.camera.far = 80;
        key.shadow.camera.left = -22; key.shadow.camera.right = 22; key.shadow.camera.top = 22; key.shadow.camera.bottom = -22;
        key.shadow.bias = -0.0004; scene.add(key);
        const fill = new THREE.PointLight(0x74eaff, 0.95, 54); fill.position.set(0, 4, 0); scene.add(fill);
        const rim = new THREE.PointLight(0x8c72ff, 0.72, 70, 2); rim.position.set(-19, 7, -16); scene.add(rim);
        const meadowLight = new THREE.PointLight(0x57c6ff, 0.48, 72, 2); meadowLight.position.set(-16, -1, 11); scene.add(meadowLight);
        const warmAccent = new THREE.PointLight(0xffd38f, 0.58, 42, 2); warmAccent.position.set(8, 1, -10); scene.add(warmAccent);

        const concrete = new THREE.MeshStandardMaterial({ color: 0x1d3043, roughness: 0.38, metalness: 0.46, envMapIntensity: 0.9 });
        const concreteDark = new THREE.MeshStandardMaterial({ color: 0x0d1926, roughness: 0.54, metalness: 0.36 });
        const warm = 0xDDFBFF;
        const turf = new THREE.MeshStandardMaterial({ color: 0x102235, emissive: 0x020812, emissiveIntensity: 0.18, roughness: 0.86, metalness: 0.1 });
        const turfDark = new THREE.MeshStandardMaterial({ color: 0x07111d, emissive: 0x01050a, emissiveIntensity: 0.16, roughness: 0.94, metalness: 0.08 });
        const turfHi = new THREE.MeshStandardMaterial({ color: 0x1b3c52, emissive: 0x03131c, emissiveIntensity: 0.18, roughness: 0.82, metalness: 0.08 });
        const stone = new THREE.MeshStandardMaterial({ color: 0x0b111a, roughness: 0.76, metalness: 0.22 });
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2b6471, emissive: 0x041923, emissiveIntensity: 0.14, roughness: 0.88, metalness: 0.06, side: THREE.DoubleSide });
        function strip(rad, y, col, tube, inten) {
          const m = new THREE.Mesh(new THREE.TorusGeometry(rad, tube || 0.045, 8, 140),
            new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: inten || 2.4, roughness: 0.4 }));
          m.rotation.x = Math.PI / 2; m.position.y = y; return m;
        }
        function glowTex(rgba) {
          const c = document.createElement('canvas'); c.width = c.height = 128;
          const ctx = c.getContext('2d');
          const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
          g.addColorStop(0, rgba); g.addColorStop(.35, rgba); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
        }
        function glowSprite(rgba, sz) {
          const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(rgba), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
          s.scale.set(sz, sz, 1); return s;
        }
        function rgbStr(col, a) { return 'rgba(' + (col >> 16 & 255) + ',' + (col >> 8 & 255) + ',' + (col & 255) + ',' + a + ')'; }
        function labelSprite(num, code, name, colHex) {
          const c = document.createElement('canvas'); c.width = 320; c.height = 160; const x = c.getContext('2d');
          x.fillStyle = colHex; x.font = 'bold 78px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(num, 160, 52);
          x.fillStyle = '#cfe0f5'; x.font = '22px sans-serif'; x.fillText(code, 160, 104);
          x.font = '28px sans-serif'; x.fillStyle = colHex; x.fillText(name, 160, 138);
          const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
          const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false }));
          s.scale.set(3.6, 1.8, 1); return s;
        }

        const deckW = 1.6, plazaR = 3.5, plazaY = -5.05;
        const levels = [
          { r: 11.0, y: 0.0, col: 0x9B8CFF, num: '01', code: 'PROFILE', name: '画像', ang: 1.7 },
          { r: 8.9, y: -1.5, col: 0x35E0D8, num: '02', code: 'PATH', name: '路径', ang: 0.2 },
          { r: 6.9, y: -2.9, col: 0x2BD66F, num: '03', code: 'RESOURCE', name: '资源', ang: -1.4 },
          { r: 5.0, y: -4.1, col: 0xF0B24A, num: '04', code: 'TUTOR', name: '辅导', ang: -3.0 },
        ];
        const nodes = [];

        function addTerrainRing(inner, outer, y, mat, opacity) {
          const mesh = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 150, 1), mat);
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.y = y;
          mesh.receiveShadow = true;
          if (opacity !== undefined) {
            mesh.material = mesh.material.clone();
            mesh.material.transparent = true;
            mesh.material.opacity = opacity;
          }
          scene.add(mesh);
          return mesh;
        }

        levels.forEach((L) => {
          addTerrainRing(L.r + 0.18, L.r + 2.8, L.y - 0.24, turf, 0.84);
          addTerrainRing(Math.max(0.8, L.r - deckW - 2.2), L.r - deckW - 0.18, L.y - 0.2, turfDark, 0.72);
          const deck = new THREE.Mesh(new THREE.RingGeometry(L.r - deckW, L.r, 120, 1), concrete);
          deck.rotation.x = -Math.PI / 2; deck.position.y = L.y; deck.receiveShadow = true; deck.castShadow = true; scene.add(deck);
          const wall = new THREE.Mesh(new THREE.CylinderGeometry(L.r, L.r, 0.55, 120, 1, true), concreteDark);
          wall.position.y = L.y + 0.27; wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
          const iwall = new THREE.Mesh(new THREE.CylinderGeometry(L.r - deckW, L.r - deckW, 0.32, 120, 1, true), concreteDark);
          iwall.position.y = L.y + 0.16; iwall.castShadow = true; scene.add(iwall);
          scene.add(strip(L.r - 0.02, L.y + 0.56, 0x9CF5FF, 0.036, 1.25));
          scene.add(strip(L.r - deckW + 0.02, L.y + 0.33, 0xDDFBFF, 0.026, 1.05));
          scene.add(strip(L.r - deckW * 0.5, L.y + 0.035, L.col, 0.012, 0.44));
          const colHex = '#' + L.col.toString(16).padStart(6, '0');
          const mx = Math.cos(L.ang) * (L.r - deckW * 0.5), mz = Math.sin(L.ang) * (L.r - deckW * 0.5);
          const beacon = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.5, 36, 1),
            new THREE.MeshBasicMaterial({ color: L.col, transparent: true, opacity: 0.68, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
          beacon.rotation.x = -Math.PI / 2;
          beacon.position.set(mx, L.y + 0.12, mz); scene.add(beacon);
          const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 6, 10),
            new THREE.MeshBasicMaterial({ color: L.col, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending }));
          beam.position.set(mx, L.y + 3, mz); scene.add(beam);
          const g = glowSprite(rgbStr(L.col, 0.16), 0.28); g.position.set(mx, L.y + 0.24, mz); g.material.opacity = 0.08; g.visible = false; scene.add(g);
          const lab = labelSprite(L.num, L.code, L.name, colHex); lab.position.set(mx, L.y + 5.2, mz); scene.add(lab);
          // 脉冲环: 当前 beat 节点上画一个持续脉动的 ground ring
          const pulseRing = new THREE.Mesh(
            new THREE.RingGeometry(0.6, 0.85, 32, 1),
            new THREE.MeshBasicMaterial({ color: L.col, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
          );
          pulseRing.rotation.x = -Math.PI / 2;
          pulseRing.position.set(mx, L.y + 0.1, mz);
          scene.add(pulseRing);
          nodes.push({ beacon, beam, glow: g, lab, pulseRing, col: L.col, pos: { x: mx, y: L.y, z: mz }, baseGlow: 0.48 });
        });

        const plazaFloor = new THREE.Mesh(new THREE.CylinderGeometry(plazaR + 0.4, plazaR + 0.4, 0.25, 96),
          new THREE.MeshStandardMaterial({ color: 0x1a2635, roughness: 0.45, metalness: 0.34 }));
        plazaFloor.position.y = plazaY; plazaFloor.receiveShadow = true; scene.add(plazaFloor);
        for (let k = 0; k < 4; k++) scene.add(strip(0.7 + k * 0.7, plazaY + 0.14, 0xBFF4FF, 0.022, 1.25));
        const coreRing = strip(0.42, plazaY + 0.2, 0xCFF6FF, 0.052, 2.65); scene.add(coreRing);
        const coreBall = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20),
          new THREE.MeshStandardMaterial({ color: 0xEFFFFF, emissive: 0x9fe8ff, emissiveIntensity: 3.15, roughness: 0.18 }));
        coreBall.position.y = plazaY + 0.3; scene.add(coreBall);
        const coreGlow = glowSprite('rgba(150,235,255,0.42)', 3.1); coreGlow.position.y = plazaY + 0.4; coreGlow.material.opacity = 0.58; scene.add(coreGlow);
        coreBall.visible = false;

        // ====== 公路 ribbon · 沿 spiralAt 平铺的发光路面 ======
        function buildRoadTexture() {
          const c = document.createElement('canvas'); c.width = 128; c.height = 256;
          const ctx = c.getContext('2d');
          // 暗底
          const grad = ctx.createLinearGradient(0, 0, 128, 0);
          grad.addColorStop(0, '#061320');
          grad.addColorStop(0.5, '#14263b');
          grad.addColorStop(1, '#061320');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 256);
          ctx.fillStyle = 'rgba(170,230,255,0.08)';
          for (let y = 0; y < 256; y += 16) ctx.fillRect(16, y, 96, 1);
          // 两侧白实线
          ctx.strokeStyle = 'rgba(210,245,255,0.7)'; ctx.lineWidth = 1.3;
          ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(8, 256); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(120, 0); ctx.lineTo(120, 256); ctx.stroke();
          // 中央双黄虚线
          ctx.strokeStyle = 'rgba(90,224,255,0.34)'; ctx.lineWidth = 1.1; ctx.setLineDash([4, 18]);
          ctx.beginPath(); ctx.moveTo(64, 0); ctx.lineTo(64, 256); ctx.stroke();
          ctx.setLineDash([]);
          // 一侧方向箭头
          ctx.fillStyle = 'rgba(110,245,255,0.62)';
          for (let y = 24; y < 256; y += 56) {
            ctx.beginPath();
            ctx.moveTo(98, y); ctx.lineTo(108, y + 10); ctx.lineTo(98, y + 20); ctx.closePath();
            ctx.fill();
          }
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          for (let i = 0; i < 180; i++) ctx.fillRect(Math.random() * 128, Math.random() * 256, 1, 1);
          const tex = new THREE.CanvasTexture(c);
          tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.repeat.set(12, 1);
          tex.anisotropy = 4;
          return tex;
        }
        const roadTex = buildRoadTexture();
        const roadMat = new THREE.MeshStandardMaterial({
          map: roadTex, color: 0x24384a,
          emissive: 0x10344a, emissiveMap: roadTex, emissiveIntensity: 1.25,
          roughness: 0.42, metalness: 0.48, side: THREE.DoubleSide,
        });
        const ROAD_SEG = 100;
        const roadSegments = [];
        function spiralUp(t) {
          // 与 spiralAt 略不同:仅取 y+0.05 作为路面,使用 t∈[0,1]
          const p = spiralAt(t);
          // 切线近似 (差分)
          const dt = 0.002;
          const p2 = spiralAt((t + dt) % 1);
          const tan = p2.clone().sub(p).normalize();
          // 沿切线的"前进"方向放置 ribbon
          return { p, tan };
        }
        for (let i = 0; i < ROAD_SEG; i++) {
          const t0 = i / ROAD_SEG, t1 = (i + 1) / ROAD_SEG;
          const a = spiralUp(t0), b = spiralUp(t1);
          // ribbon 段:沿切线方向,横向 0.5 宽
          const UP = new THREE.Vector3(0, 1, 0);
          const rightA = a.tan.clone().cross(UP).normalize().multiplyScalar(0.28);
          const rightB = b.tan.clone().cross(UP).normalize().multiplyScalar(0.28);

          return new THREE.Vector3(n.pos.x, n.pos.y + 2.05, n.pos.z);
        }
        function nodeFlightPoint(fromIndex, toIndex, progress) {
          const p = clamp01(progress);
          const start = nodeAirPoint(fromIndex);
          const end = nodeAirPoint(toIndex);
          if (fromIndex === toIndex) {
            end.y += 0.16 * Math.sin(p * Math.PI * 2);
          }
          const mid = start.clone().add(end).multiplyScalar(0.5);
          mid.y += Math.min(4.2, 1.8 + start.distanceTo(end) * 0.16);
          return new THREE.QuadraticBezierCurve3(start, mid, end).getPoint(p);
        }
        function writebackFlightPoint(progress) {
          const p = clamp01(progress);
          const start = nodeAirPoint(4);
          const top = new THREE.Vector3(start.x, elevTop + 4.85, start.z);
          const ease = p * p * (3 - 2 * p);
          return start.clone().lerp(top, ease);
        }
        function writebackRiseYaw() {
          return 0;
        }

        if (composer !== 'fail' && EffectComposer) {
          composer = new EffectComposer(renderer);
          composer.addPass(new RenderPass(scene, camera));
          const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.46, 0.38, 0.72);
          composer.addPass(bloom);
        }

        // camera + choreography
        let theta = 0.9, phi = 0.95, rad = 44, drag = false, px = 0, py = 0, userControl = false;
        const tgt = new THREE.Vector3(0, -2.2, 0);
        const goal = { theta: 0.9, phi: 0.95, rad: 44, ty: -2.2, tx: 0, tz: 0, auto: true, loop: false };
        let loopT0 = 0, loopSphY = elevBot + 0.5, loopAngStart = 0.5;
        let beatStartedAt = performance.now() / 1000;
        const SEGMENT_SECONDS = 5.2;
        const WRITEBACK_RISE_AT = 0;
        const WRITEBACK_DONE_AT = 0.74;
        const loopCamGoal = new THREE.Vector3(), loopLookGoal = new THREE.Vector3(), loopLookCur = new THREE.Vector3(0, plazaY, 0);
        const dom = renderer.domElement;
        dom.style.cursor = 'grab';
        dom.addEventListener('pointerdown', e => { drag = true; userControl = true; px = e.clientX; py = e.clientY; dom.setPointerCapture(e.pointerId); dom.style.cursor = 'grabbing'; });
        dom.addEventListener('pointerup', () => { drag = false; dom.style.cursor = 'grab'; });
        dom.addEventListener('pointermove', e => { if (!drag) return; theta -= (e.clientX - px) * 0.005; phi = Math.max(0.2, Math.min(1.35, phi - (e.clientY - py) * 0.005)); px = e.clientX; py = e.clientY; });
        dom.addEventListener('wheel', e => { e.preventDefault(); rad = Math.max(16, Math.min(64, rad * (1 + e.deltaY * 0.0009))); userControl = true; }, { passive: false });
        addEventListener('resize', () => { camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H()); if (composer && composer.setSize) composer.setSize(W(), H()); });

        function applyBeat() {
          const id = HUB.state.id;
          beatStartedAt = performance.now() / 1000;
          if (id === 'profile' || id === 'depart' || id === 'loop') droneTrail.reset();
          lastDroneLaneT = 0;
          writebackDone.style.opacity = '0';
          writebackDone.style.transform = 'translate(-50%,12px)';
          userControl = false;
          const li = ['profile', 'path', 'resource', 'tutor', 'eval'].indexOf(id);
          if (id === 'depart') {
            Object.assign(goal, { theta: 0.7, phi: 1.0, rad: 46, tx: 0, ty: -2.0, tz: 0, auto: true, loop: false });
            packetGoal.set(0, 6, 0);
          } else if (id === 'loop') {
            Object.assign(goal, { theta: 0.82, phi: 0.72, rad: 31, tx: 0, ty: plazaY + 2.6, tz: 0, loop: false, auto: true });
            loopT0 = clock.getElapsedTime();
            loopAngStart = Math.atan2(camera.position.z, camera.position.x); // 从当前方位起步,避免方位跳变
            loopLookCur.set(0, plazaY + 0.6, 0);
            packetGoal.set(0, elevTop, 0);
          } else if (li >= 0) {
            const n = nodes[li];
            const beaconAng = Math.atan2(n.pos.z, n.pos.x);
            const closeR = li === 4 ? 28 : 24 + (levels[Math.min(li, 3)].r) * 0.72;
            Object.assign(goal, {
              theta: beaconAng - 0.35,
              phi: li === 4 ? 0.62 : 0.86,
              rad: li === 4 ? 27 : closeR,
              tx: n.pos.x * 0.4, ty: n.pos.y + (li === 4 ? 0.4 : 0.8), tz: n.pos.z * 0.4,
              auto: true, loop: false,
            });
            packetGoal.set(n.pos.x, n.pos.y + 0.6, n.pos.z);
          }

          // ====== 2 智能体连线 · 当前 beat 节点 + 下一拍节点 ======
          const beatIdx = ['profile', 'path', 'resource', 'tutor', 'eval', 'loop'].indexOf(id);
          let a = null, b = null;
          if (beatIdx >= 0 && beatIdx < 5) { a = nodes[beatIdx]; b = nodes[Math.min(beatIdx + 1, 4)]; }
          else if (id === 'loop') { a = nodes[4]; b = nodes[0]; } // 回写: eval → profile 闭环
          // 当前 beat 节点脉动环 (其他节点环淡化)
          const pulseT = clock.getElapsedTime();
          for (let i = 0; i < nodes.length; i++) {
            const n = nodes[i];
            if (!n.pulseRing) continue;
            if (i === beatIdx) {
              // 脉动用 scale (无 material 变更, 不触发 GPU upload)
              const r = 0.6 + Math.sin(pulseT * 4) * 0.18;
              n.pulseRing.scale.setScalar(r);
              n.pulseRing.visible = true;
            } else {
              n.pulseRing.visible = false; // 用 visible=false 替代 opacity=0
            }
          }
          if (a && b) {
            // 颜色用当前拍节点 col (不透明度 0.55 避免和飞机争抢视线)
            const colA = (a.col !== undefined) ? a.col : 0x9fd6ff;
            setLinkEndpoints(a, b, colA);
            // dashOffset 在 render loop 里更新, 不在 applyBeat 里 (避免频繁 material 变更)
          } else {
            linkLine.visible = false;
            linkCurve = null;
          }
        }
        HUB._apply = applyBeat;

        function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; return a + d * t; }

        const clock = new THREE.Clock();
        function animate() {
          window.__hubRAF = requestAnimationFrame(animate);
          try {
          const t = clock.getElapsedTime();
          const id = HUB.state.id;
          const li = ['profile', 'path', 'resource', 'tutor', 'eval'].indexOf(id);

          if (goal.loop && !userControl) {
            // 回写镜头 · 一镜到底升镜:相机始终在塔体最外圈(不穿模),随球一路升到高空俯瞰,单一缓动无跳变
            const e = Math.min(1, (t - loopT0) / 10.0);
            const k = e * e * (3 - 2 * e);                    // 单一缓动
            loopSphY = (elevBot + 0.9) + k * ((elevTop + 8.0) - (elevBot + 0.9)); // 球从谷底一路升出井口到高空
            const camR = 13 + k * 13;                         // 13 → 26,恒在最大平台半径(11.4)之外,杜绝穿模
            const camH = (plazaY + 4.0) + k * 22.0;           // 由谷口一路单调升到高空俯瞰
            const ang = loopAngStart + k * 0.8;               // 轻微转向,随 k 趋缓而停
            loopCamGoal.set(Math.cos(ang) * camR, camH, Math.sin(ang) * camR);
            camera.position.lerp(loopCamGoal, 0.05);
            loopLookGoal.set(0, loopSphY - k * 2.5, 0);       // 始终望向上升的球
            loopLookCur.lerp(loopLookGoal, 0.05);
            camera.lookAt(loopLookCur);
            theta = ang; phi = 1.0; rad = camR; tgt.copy(loopLookCur);
            const lbl = document.getElementById('wb-label');
            if (lbl) { const on = k > 0.82; lbl.style.opacity = on ? '1' : '0'; lbl.style.transform = on ? 'translate(-50%,-50%)' : 'translate(-50%,-42%)'; }
          } else {
            if (!userControl) {
              theta = lerpAngle(theta, goal.theta, 0.045);
              phi += (goal.phi - phi) * 0.045;
              rad += (goal.rad - rad) * 0.045;
              tgt.x += (goal.tx - tgt.x) * 0.05;
              tgt.y += (goal.ty - tgt.y) * 0.05;
              tgt.z += (goal.tz - tgt.z) * 0.05;
              if (id === 'depart') theta += 0.0016;
            }
            camera.position.set(tgt.x + rad * Math.sin(phi) * Math.cos(theta), tgt.y + rad * Math.cos(phi), tgt.z + rad * Math.sin(phi) * Math.sin(theta));
            camera.lookAt(tgt);
          }

          nodes.forEach((n, i) => {
            const active = (i === li) || (id === 'loop');
            const target = active ? (n.baseGlow * (1.25 + 0.25 * Math.sin(t * 3))) : n.baseGlow * 0.5;
            n.glow.scale.x += (target - n.glow.scale.x) * 0.1; n.glow.scale.y = n.glow.scale.x;
            if (n.beacon && n.beacon.material.emissiveIntensity !== undefined) {
              const ei = active ? 3.4 + 0.6 * Math.sin(t * 4) : 1.4;
              n.beacon.material.emissiveIntensity += (ei - n.beacon.material.emissiveIntensity) * 0.1;
            }
            if (n.beam) { const op = active ? 0.45 + 0.15 * Math.sin(t * 2 + i) : 0.12; n.beam.material.opacity += (op - n.beam.material.opacity) * 0.1; }
          });

          const pulse = 1 + 0.18 * Math.sin(t * 2.2); coreBall.scale.setScalar(pulse); coreGlow.scale.setScalar(3.1 * pulse);

          if (id === 'loop') {
            capsule.position.y = loopSphY;
          } else {
            const capGoalY = (id === 'eval') ? elevBot + 0.8 : elevBot + 0.4;
            capsule.position.y += (capGoalY - capsule.position.y) * 0.06;
          }
          capGlow.position.set(0, capsule.position.y, 0);
          capHalo.position.set(0, capsule.position.y, 0);
          capHalo.rotation.z = t * 0.6;
          capHalo.material.opacity = (id === 'loop') ? 0.6 : 0.22;
          const capPulse = 1 + 0.08 * Math.sin(t * 3.5);
          capsule.scale.setScalar((id === 'loop') ? capPulse * 1.05 : capPulse);
          capsule.material.emissiveIntensity = (id === 'loop' || id === 'eval') ? 3.8 : 2.2;

          packet.position.lerp(packetGoal, 0.07);
          packet.scale.setScalar(1 + 0.15 * Math.sin(t * 5));
          packetGlow.position.copy(packet.position);
          packet.visible = false; packetGlow.visible = false; packetGlow.material.opacity = 0;

          const flowSpeed = (id === 'depart') ? 0.04 : 0.12;
          for (let i = 0; i < flowCount; i++) {
            flowT[i] += flowSpeed * 0.016;
            if (flowT[i] > 1) flowT[i] -= 1;
            const p = spiralAt(flowT[i]);
            flowPos[i * 3] = p.x; flowPos[i * 3 + 1] = p.y; flowPos[i * 3 + 2] = p.z;
          }
          flowGeo.attributes.position.needsUpdate = true;

          // ====== 智能小飞机 · 沿节点间"起飞-弧飞-降落" ======
          // 状态: 每拍从一个节点跳到下一个节点
          //   takeoff 0..0.3: 抬升 (从节点 y 升到 y+4)
          //   cruise  0.3..0.7: 沿贝塞尔弧线飞向下一节点
          //   land    0.7..1.0: 下降到下一节点 y
          // beatT 来自 setLinkEndpoints 上一帧计算
          const curId = HUB.state.id;
          const order = ['profile', 'path', 'resource', 'tutor', 'eval'];
          let curIdx = order.indexOf(curId);
          if (curId === 'loop') curIdx = 4; // 闭环回 profile
          if (curIdx < 0) curIdx = 0; // depart/profile 取 0
          const nextIdx = (curIdx + 1) % 5;
          const aNode = nodes[curIdx];
          const bNode = nodes[nextIdx];
          // 用绝对时间驱动 (0..1 循环, 周期约 6.7 秒)
          carT += 0.0025;
          if (carT > 1) carT -= 1;
          // 节点位置
          const aPos = new THREE.Vector3(aNode.pos.x, aNode.pos.y, aNode.pos.z);
          const bPos = new THREE.Vector3(bNode.pos.x, bNode.pos.y, bNode.pos.z);
          // 弧线控制点: a→b 中点抬升 +4
          const mid = aPos.clone().add(bPos).multiplyScalar(0.5);
          mid.y += 4.0;
          // t 分段映射 (4 段: 悬停 / 起飞 / 巡航 / 降落)
          // 0.00..0.45 悬停 (飞机停在当前节点上方 2y, 微微上下浮动)
          // 0.45..0.62 起飞 (抬升到中点)
          // 0.62..0.85 巡航 (沿贝塞尔弧线)
          // 0.85..1.00 降落 (下降到下一节点)
          const tPhase = carT;
          let carPos = new THREE.Vector3();
          let pitch = 0; // 俯仰角
          let yaw = 0;   // 偏航角
          const hoverY = 2.0; // 悬停高度 (节点上方 2y)
          if (tPhase < 0.45) {
            // 悬停段: 飞机停在当前节点上方 hoverY, 微微浮动
            const tt = tPhase / 0.45; // 0..1
            const float = Math.sin(tt * Math.PI * 4) * 0.15; // 微微上下浮
            carPos.set(aPos.x, aPos.y + hoverY + float, aPos.z);
            // 朝向 aPos 附近任意方向 (保持原 yaw 不动, 让飞机像"驻停")
            yaw = 0; pitch = 0;
          } else if (tPhase < 0.62) {
            // takeoff 0.45..0.62: 抬升 (从 aPos.y+hoverY 抬升到 mid.y - 1)
            const tt = (tPhase - 0.45) / 0.17; // 0..1
            const ease = 1 - Math.pow(1 - tt, 2); // ease-out
            const start = new THREE.Vector3(aPos.x, aPos.y + hoverY, aPos.z);
            carPos.lerpVectors(start, mid, ease);
            // 飞机在抬升段, 朝向沿 aPos→mid 方向, 仰角 ~30°
            const dir = mid.clone().sub(start).normalize();
            yaw = Math.atan2(-dir.z, dir.x);
            pitch = -0.5 * ease; // 抬头 (rotation.x 负值 = nose up)
          } else if (tPhase < 0.85) {
            // cruise 0.18..0.82: 沿贝塞尔弧线
            const tt = (tPhase - 0.18) / 0.64; // 0..1
            const t2 = 0.5 * (1 - Math.cos(Math.PI * tt)); // sin 半周期, 弧线更平顺
            // 二次贝塞尔 a→mid→b
            const oneMinus = 1 - t2;
            carPos.x = oneMinus * oneMinus * aPos.x + 2 * oneMinus * t2 * mid.x + t2 * t2 * bPos.x;
            carPos.y = oneMinus * oneMinus * aPos.y + 2 * oneMinus * t2 * mid.y + t2 * t2 * bPos.y;
            carPos.z = oneMinus * oneMinus * aPos.z + 2 * oneMinus * t2 * mid.z + t2 * t2 * bPos.z;
            // 朝向沿弧线切线: 差分
            const dt = 0.01;
            const t2p = Math.min(1, t2 + dt);
            const oneMinusp = 1 - t2p;
            const nextX = oneMinusp * oneMinusp * aPos.x + 2 * oneMinusp * t2p * mid.x + t2p * t2p * bPos.x;
            const nextY = oneMinusp * oneMinusp * aPos.y + 2 * oneMinusp * t2p * mid.y + t2p * t2p * bPos.y;
            const nextZ = oneMinusp * oneMinusp * aPos.z + 2 * oneMinusp * t2p * mid.z + t2p * t2p * bPos.z;
            const tanX = nextX - carPos.x;
            const tanY = nextY - carPos.y;
            const tanZ = nextZ - carPos.z;
            yaw = Math.atan2(-tanZ, tanX);
            // 弧线向上时 nose up, 向下时 nose down
            // 在 Three.js rotation.x 负值 = nose up (绕 -X 旋转)
            pitch = -Math.atan2(tanY, Math.hypot(tanX, tanZ));
          } else {
            // land 0.85..1.0: 下降到 b 节点上方 hoverY (悬停位置)
            const tt = (tPhase - 0.85) / 0.15; // 0..1
            const ease = tt * tt; // ease-in
            const end = new THREE.Vector3(bPos.x, bPos.y + hoverY, bPos.z);
            carPos.lerpVectors(mid, end, ease);
            // 朝向沿 mid→end 方向, 俯角 ~-30°
            const dir = end.clone().sub(mid).normalize();
            yaw = Math.atan2(-dir.z, dir.x);
            pitch = 0.5 * ease; // 低头
          }
          carGroup.position.copy(carPos);
          // 应用旋转: 模型默认沿 +X 飞行, 三维旋转: 偏航(y)、俯仰(x)
          carGroup.rotation.set(pitch, yaw, 0);
          // 螺旋桨持续转
          if (propeller) propeller.rotation.x += 0.4;
          {
            const segmentElapsed = Math.max(0, performance.now() / 1000 - beatStartedAt);
            const segmentProgress = clamp01(segmentElapsed / SEGMENT_SECONDS);
            const eased = segmentProgress * segmentProgress * (3 - 2 * segmentProgress);
            let fromIndex = 0;
            let toIndex = 1;
            if (curId === 'profile') { fromIndex = 0; toIndex = 1; }
            else if (curId === 'path') { fromIndex = 1; toIndex = 2; }
            else if (curId === 'resource') { fromIndex = 2; toIndex = 3; }
            else if (curId === 'tutor') { fromIndex = 3; toIndex = 4; }
            else if (curId === 'eval') { fromIndex = 4; toIndex = 4; }
            const isWritebackFlight = curId === 'loop';
            const dronePos = isWritebackFlight
              ? writebackFlightPoint(eased)
              : nodeFlightPoint(fromIndex, toIndex, eased);
            const nextDronePos = isWritebackFlight
              ? writebackFlightPoint(Math.min(1, eased + 0.018))
              : nodeFlightPoint(fromIndex, toIndex, Math.min(1, eased + 0.018));
            const tangent = nextDronePos.sub(dronePos).normalize();
            let droneYaw = Math.atan2(-tangent.z, tangent.x);
            let dronePitch = -Math.atan2(tangent.y, Math.hypot(tangent.x, tangent.z)) * 0.82;
            let droneBank = Math.sin(eased * Math.PI * 2) * 0.08;
            const levelWritebackRise = isWritebackFlight && eased >= WRITEBACK_RISE_AT;
            if (levelWritebackRise) {
              droneYaw = writebackRiseYaw();
              dronePitch = 0;
              droneBank = 0;
            }
            carGroup.position.copy(dronePos);
            if (levelWritebackRise) {
              carGroup.quaternion.setFromEuler(new THREE.Euler(0, droneYaw, 0, 'YXZ'));
            } else {
              carGroup.rotation.set(dronePitch, droneYaw, droneBank);
            }
            const activeColor = isWritebackFlight ? 0xffd78a : (nodes[fromIndex]?.col || 0x8fefff);
            droneTrail.setColor(activeColor);
            if (segmentProgress < lastDroneLaneT) droneTrail.reset();
            lastDroneLaneT = segmentProgress;
            if (!isWritebackFlight && segmentProgress < 0.985) droneTrail.push(dronePos);
            const doneOn = isWritebackFlight && segmentProgress > WRITEBACK_DONE_AT;
            writebackDone.style.opacity = doneOn ? '1' : '0';
            writebackDone.style.transform = doneOn ? 'translate(-50%,0)' : 'translate(-50%,12px)';
            droneAccentMats.forEach((mat) => {
              if (mat.color) mat.color.setHex(activeColor);
              mat.opacity = 0.72 + 0.2 * Math.sin(t * 6);
            });
            droneRotors.forEach((rotor, index) => {
              rotor.rotation.z += 0.12 + index * 0.015;
              rotor.material.color.setHex(activeColor);
            });
          }
          // 路面纹理沿 U 平移 (视觉跑动)
          roadTex.offset.x = (roadTex.offset.x - 0.012) % 1;

          // 弧线 visibility: 悬停时隐藏, 起飞后显示 (避免每帧改 material.opacity)
          if (linkCurve) {
            linkLine.visible = false;
          }

          if (composer && composer.render) composer.render(); else renderer.render(scene, camera);
          window.__hubdbg = { ver: HUB_BUILD, id: HUB.state.id, interior: !!goal.interior, uc: userControl, camR: Math.round(Math.hypot(camera.position.x, camera.position.z)), camY: Math.round(camera.position.y) };
          } catch (e) { window.__hubErr = (window.__hubErr || 0) + 1; window.__hubErrMsg = String(e && e.stack || e); }
        }
        animate();

        HUB.state.ready = true;
        startAgentHubCycle();
        HUB._readyCbs.forEach(cb => { try { cb(); } catch (e) {} });
        HUB._readyCbs = [];
      } catch (err) {
        wrap.innerHTML = '<div style="padding:24px;color:#9FB6DC;font-family:sans-serif;font-size:14px">三维场景加载失败:' + (err && err.message ? err.message : err) + '</div>';
      }
    })();
  }
  </script>
